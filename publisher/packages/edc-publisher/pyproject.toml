[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constructx-catalog-publisher"
version = "0.1.0"
description = "Provider-side EDC asset to DCAT conversion and source-scoped publication"
requires-python = ">=3.11"
dependencies = ["rdflib>=7.1,<8", "pyshacl>=0.30,<0.41"]

[project.scripts]
constructx-publisher = "constructx_catalog_publisher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
constructx_catalog_publisher = ["profile.ttl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
